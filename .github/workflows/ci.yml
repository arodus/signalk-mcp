name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        signalk: [2.32.0, 2.33.0]
    services:
      influxdb:
        image: influxdb:1.8.10@sha256:299ebda2c7e308dbef42e26ac9b8fd1d9b3bcb8a0aee80c6509aa0219c1d0290
        ports: [8086:8086]
        options: >-
          --health-cmd "curl --fail http://localhost:8086/ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts --omit=optional
      - name: Install alternate Signal K runtime
        if: matrix.signalk != '2.33.0'
        run: |
          npm install --prefix "$RUNNER_TEMP/signalk-runtime" --ignore-scripts --omit=optional --no-audit --no-fund "signalk-server@$SIGNALK_VERSION" "@signalk/server-api@$SIGNALK_VERSION"
          echo "MCP_TEST_SERVER_DIR=$RUNNER_TEMP/signalk-runtime/node_modules/signalk-server" >> "$GITHUB_ENV"
        env:
          SIGNALK_VERSION: ${{ matrix.signalk }}
      - run: |
          python -m venv /tmp/signalk-mcp-python
          /tmp/signalk-mcp-python/bin/pip install -r test/python-requirements.txt
      - run: npm run check
        env:
          MCP_TEST_INFLUX_URL: http://127.0.0.1:8086
          MCP_TEST_PYTHON: /tmp/signalk-mcp-python/bin/python
          MCP_TEST_SERVER_VERSION: ${{ matrix.signalk }}
      - name: Verify installed release artifact
        run: npm run verify:package -- "$RUNNER_TEMP/package-smoke"
        env:
          MCP_TEST_INFLUX_URL: http://127.0.0.1:8086
          MCP_TEST_PYTHON: /tmp/signalk-mcp-python/bin/python
          MCP_TEST_SERVER_VERSION: ${{ matrix.signalk }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-node-${{ matrix.node }}-signalk-${{ matrix.signalk }}
          path: |
            ${{ runner.temp }}/package-smoke/*.tgz
            ${{ runner.temp }}/package-smoke/receipt.json
