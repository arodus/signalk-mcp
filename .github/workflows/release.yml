name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  validate-plugin:
    uses: ./.github/workflows/signalk-ci.yml

  publish:
    needs: [validate, validate-plugin]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --ignore-scripts --omit=optional
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.6.0
      - name: Verify release tag and notes
        run: node scripts/verify-release-tag.mjs "$GITHUB_REF_NAME"
      - name: Build and inspect package
        run: |
          npm run build
      - name: Create release package
        id: package
        run: node scripts/create-release-package.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the exact release tarball
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.package-file }}
        run: |
          python -m venv "$RUNNER_TEMP/mcp-python"
          "$RUNNER_TEMP/mcp-python/bin/pip" install -r test/python-requirements.txt
          mkdir "$RUNNER_TEMP/release-install"
          npm install --prefix "$RUNNER_TEMP/release-install" --omit=dev --ignore-scripts "$PWD/$PACKAGE_FILE"
          MCP_TEST_PLUGIN_DIR="$RUNNER_TEMP/release-install/node_modules/signalk-mcp" \
          MCP_TEST_PYTHON="$RUNNER_TEMP/mcp-python/bin/python" \
          node --test --test-force-exit test/integration.test.cjs test/native-puts.test.cjs test/native-posts.test.cjs test/resources-native.test.cjs test/production-plugin.test.cjs
          npm audit --prefix "$RUNNER_TEMP/release-install" --omit=dev
      - name: Extract release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" release-notes.md
      - name: Preserve reviewed package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-npm-package
          path: |
            ${{ steps.package.outputs.package-file }}
            ${{ steps.package.outputs.checksum-file }}
          if-no-files-found: error
      - name: Select npm distribution tag
        id: channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        run: npm publish "${{ steps.package.outputs.package-file }}" --access public --tag "${{ steps.channel.outputs.tag }}"
      - name: Verify published release commit
        run: node scripts/verify-published-release.mjs
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_type=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_type=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.package-file }}" \
            "${{ steps.package.outputs.checksum-file }}" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${release_type[@]}"
